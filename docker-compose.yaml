networks:
  buzz_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  nextcloud_html:
  qdrant_data: # Hafif vektör arama için yerel depolama

services:
  # --- REVERSE PROXY (SSL / TLS) ---
  caddy:
    image: caddy:2-alpine
    container_name: buzz-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./caddy_data:/data
    networks:
      - buzz_network

  # --- HEADLESS BROWSER (X / INSTAGRAM SCRAPING) ---
  browserless:
    image: ghcr.io/browserless/chromium:latest
    container_name: buzz-browserless
    restart: unless-stopped
    environment:
      - TIMEOUT=30000
      - CONCURRENCY=5
    networks:
      - buzz_network

  # --- QDRANT (Hafif Vektör Veritabanı / RAG) ---
  qdrant:
    image: qdrant/qdrant:latest
    container_name: buzz-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - buzz_network

  # --- BUZZ CORE SERVICES ---
  buzz-relay:
    image: ghcr.io/block/buzz:latest
    container_name: buzz-relay
    restart: unless-stopped
    environment:
      - BUZZ_REQUIRE_RELAY_MEMBERSHIP=true
      - BUZZ_REQUIRE_AUTH_TOKEN=true
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/buzz
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    networks:
      - buzz_network

  postgres:
    image: postgres:16-alpine
    container_name: buzz-postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=buzz
    networks:
      - buzz_network

  redis:
    image: redis:7-alpine
    container_name: buzz-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - buzz_network

  # --- HERMES AGENT (OPENROUTER LLM) ---
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-agent
    restart: unless-stopped
    volumes:
      - ./mcp_config.json:/app/mcp_config.json
    environment:
      # OpenRouter Bulut Yapılandırması
      - LLM_PROVIDER=openrouter
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DEFAULT_MODEL=google/gemini-3.1-flash
      - DEEP_RESEARCH_MODEL=meta-llama/llama-3.3-70b-instruct
      
      # Vektör Hafıza, MCP ve Browserless
      - QDRANT_URL=http://qdrant:6333
      - MCP_CONFIG_PATH=/app/mcp_config.json
      - BROWSERLESS_URL=ws://browserless:3000
      
      # Buzz & Nextcloud Entegrasyonu
      - BUZZ_RELAY_URL=ws://buzz-relay:3000
      - WEBDAV_ENDPOINT=http://nextcloud-app:80/remote.php/dav/files/${NEXTCLOUD_ADMIN_USER}/Bilgi_Tabani/
      - WEBDAV_USER=${NEXTCLOUD_ADMIN_USER}
      - WEBDAV_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
    networks:
      - buzz_network

  # --- NEXTCLOUD (WEBDAV & STORAGE) ---
  nextcloud:
    image: nextcloud:33.0.8-fpm-alpine
    container_name: nextcloud-app
    restart: unless-stopped
    volumes:
      - nextcloud_html:/var/www/html
      - /mnt/storagebox/nextcloud_data:/var/www/html/data
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_HOST_PASSWORD=${REDIS_PASSWORD}
    networks:
      - buzz_network