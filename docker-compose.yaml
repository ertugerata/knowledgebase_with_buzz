networks:
  buzz_network:
    driver: bridge

volumes:
  redis_data:
  nextcloud_html:
  qdrant_data: # Hafif vektör arama için yerel depolama
  minio_data:

services:
  # --- REVERSE PROXY (SSL / TLS) ---
  caddy:
    image: caddy:2-alpine
    container_name: buzz-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./caddy_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80 || curl -f http://localhost:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      nextcloud:
        condition: service_healthy
      buzz-relay:
        condition: service_healthy
    networks:
      - buzz_network

  # --- HEADLESS BROWSER (X / INSTAGRAM SCRAPING) ---
  browserless:
    image: ghcr.io/browserless/chromium:latest
    container_name: buzz-browserless
    restart: unless-stopped
    environment:
      - TIMEOUT=30000
      - CONCURRENCY=5
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://localhost:3000/pressure\", (res) => process.exit(res.statusCode === 200 ? 0 : 1))' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - buzz_network

  # --- QDRANT (Hafif Vektör Veritabanı / RAG) ---
  qdrant:
    image: qdrant/qdrant:latest
    container_name: buzz-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/readyz || wget --no-verbose --tries=1 --spider http://localhost:6333/readyz || timeout 2 bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - buzz_network

  # --- MINIO (S3 MEDYA VE GIT OBJECT STORE) ---
  minio:
    image: minio/minio:latest
    container_name: buzz-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || wget --no-verbose --tries=1 --spider http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - buzz_network

  createbuckets:
    image: minio/mc:latest
    container_name: buzz-minio-createbuckets
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\";
      /usr/bin/mc mb --ignore-existing myminio/buzz-media;
      /usr/bin/mc anonymous set none myminio/buzz-media;
      exit 0;
      "
    networks:
      - buzz_network

  # --- BUZZ CORE SERVICES ---
  buzz-relay:
    build: ./buzz
    image: buzz-relay:latest
    container_name: buzz-relay
    restart: unless-stopped
    environment:
      - BUZZ_AUTO_MIGRATE=true
      - BUZZ_REQUIRE_RELAY_MEMBERSHIP=${BUZZ_REQUIRE_RELAY_MEMBERSHIP:-false}
      - BUZZ_REQUIRE_AUTH_TOKEN=${BUZZ_REQUIRE_AUTH_TOKEN:-true}
      - BUZZ_RELAY_PRIVATE_KEY=${BUZZ_RELAY_PRIVATE_KEY:-}
      - RELAY_OWNER_PUBKEY=${RELAY_OWNER_PUBKEY:-}
      - BUZZ_S3_ENDPOINT=http://minio:9000
      - BUZZ_S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - BUZZ_S3_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - BUZZ_S3_BUCKET=buzz-media
      - BUZZ_S3_REGION=us-east-1
      - BUZZ_S3_ADDRESSING_STYLE=path
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/buzz
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/_liveness || curl -fsS http://127.0.0.1:3000/_liveness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    networks:
      - buzz_network

  postgres:
    image: postgres:16-alpine
    container_name: buzz-postgres
    restart: unless-stopped
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=buzz
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-buzz_user} -d buzz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - buzz_network

  redis:
    image: redis:7-alpine
    container_name: buzz-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$REDIS_PASSWORD\" redis-cli ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - buzz_network

  # --- HERMES AGENT (OPENROUTER LLM) ---
  hermes:
    build: ./hermes
    image: hermes-agent:latest
    container_name: hermes-agent
    restart: unless-stopped
    stdin_open: true # docker run -i karşılığı
    tty: true        # docker run -t karşılığı
    volumes:
      - ./hermes/mcp_config.json:/app/mcp_config.json
    environment:
      # OpenRouter Bulut Yapılandırması
      - LLM_PROVIDER=openrouter
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-openrouter/free}
      - DEEP_RESEARCH_MODEL=${DEEP_RESEARCH_MODEL:-meta-llama/llama-3.3-70b-instruct}
      
      # Vektör Hafıza, MCP ve Browserless
      - QDRANT_URL=http://qdrant:6333
      - MCP_CONFIG_PATH=/app/mcp_config.json
      - BROWSERLESS_URL=ws://browserless:3000
      
      # Buzz & Nextcloud Entegrasyonu
      - BUZZ_RELAY_URL=ws://buzz-relay:3000
      - WEBDAV_ENDPOINT=http://nextcloud-app:80/remote.php/dav/files/${NEXTCLOUD_ADMIN_USER}/Bilgi_Tabani/
      - WEBDAV_USER=${NEXTCLOUD_ADMIN_USER}
      - WEBDAV_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep -E 'python|hermes' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      buzz-relay:
        condition: service_healthy
      nextcloud:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      browserless:
        condition: service_healthy
    networks:
      - buzz_network

  # --- NEXTCLOUD (WEBDAV & STORAGE) ---
  nextcloud:
    build: ./nextcloud
    image: nextcloud-app:latest
    container_name: nextcloud-app
    restart: unless-stopped
    volumes:
      - nextcloud_html:/var/www/html
      - ./nextcloud_data:/var/www/html/data
      - ./nextcloud/hooks/pre-installation:/docker-entrypoint-hooks.d/pre-installation:ro
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_HOST_PASSWORD=${REDIS_PASSWORD}
      - NC_SETUP_CREATE_DB_USER=false
      - NC_setup_create_db_user=false
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost 127.0.0.1 ${DOMAIN_NAME:-localhost} ${NEXTCLOUD_ADDITIONAL_TRUSTED_DOMAINS:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/status.php || wget --no-verbose --tries=1 --spider http://localhost:80/status.php || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - buzz_network
